name: Flutter

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/flutter/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/flutter/**'
  push:
    tags:
      - 'v*'

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/flutter

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter test

  build-apk:
    name: Build APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: iomtea-tools-${{ github.ref_name }}
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

  build-web:
    name: Build Web
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: iomtea-tools-${{ github.ref_name }}-web
          path: apps/flutter/build/web/
          retention-days: 90

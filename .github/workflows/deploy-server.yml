name: Deploy Server

on:
  push:
    tags:
      - 'v*'
      - 'server@*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iomtea/shared-types typecheck
      - run: pnpm --filter @iomtea/server typecheck

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image repo
        id: repo
        run: echo "image_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_repo }}/server
          tags: |
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export COMPOSE_FILE=/srv/iomtea/docker-compose.yml
            export COMPOSE_PROJECT_DIR=/srv/iomtea
            export IMAGE_REPO=${{ steps.repo.outputs.image_repo }}
            export IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
            printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull server
            docker compose up -d --no-deps server
            healthy=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health; then
                echo "Service healthy" && healthy=1 && break
              fi
              echo "Waiting... ($i/30)" && sleep 2
            done
            if [ "$healthy" -eq 0 ]; then
              echo "ERROR: Server failed to become healthy"
              docker compose logs server --tail 80
              exit 1
            fi
            docker logout ghcr.io

  db-migrate:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Run migration
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export COMPOSE_FILE=/srv/iomtea/docker-compose.yml
            export COMPOSE_PROJECT_DIR=/srv/iomtea
            export IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
            # Reset DB journal to align with current migration files, then apply all
            docker compose exec -T postgres psql -U postgres -d iomtea -c "DELETE FROM drizzle.__drizzle_migrations;"
            docker compose run --rm server pnpm db:migrate || (
              # Fallback: drop schema and reapply from scratch
              docker compose exec -T postgres psql -U postgres -d iomtea -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
              docker compose run --rm server pnpm db:migrate
            )

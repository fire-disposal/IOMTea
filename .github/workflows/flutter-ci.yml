name: Flutter CI

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/flutter/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/flutter/**'

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/flutter

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter test

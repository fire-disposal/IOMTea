name: iomtea_tools
description: IOMTea Flutter 实验工具 — MQTT/YOLO/IMU/BLE 调试面板
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # MQTT
  mqtt_client: ^10.0.0

  # 传感器
  sensors_plus: ^6.1.0

  # 路由
  go_router: ^14.0.0

  # HTTP
  http: ^1.2.0

  # 存储
  shared_preferences: ^2.3.0
  sqflite: ^2.4.2

  # 后台服务
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1

  # 通知
  flutter_local_notifications: ^21.0.0

  # 动画
  flutter_animate: ^4.5.2

  # YOLO
  ultralytics_yolo: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iomtea
      POSTGRES_USER: iomtea
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iomtea -d iomtea"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    image: ghcr.io/${IMAGE_REPO}/server:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://iomtea:${DB_PASSWORD}@postgres:5432/iomtea
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: "3000"
    ports:
      - "${SERVER_PORT:-3000}:3000"
    restart: unless-stopped

  web:
    image: ghcr.io/${IMAGE_REPO}/web:latest
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  pgdata:
